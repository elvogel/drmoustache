name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # SDK 11 builds (global.json); the 8 and 10 runtimes run the older targets' tests.
          dotnet-version: |
            8.0.x
            10.0.x
            11.0.x

      # The template tests scaffold projects that restore Microsoft.Data.Sqlite
      # and the Microsoft.Extensions.* tree from scratch. On a cold cache that
      # download dominates the run: locally the suite took over 15 minutes cold
      # and about 45 seconds warm. Caching turns most CI runs into the warm case.
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore DrMoustache.slnx

      - name: Build
        run: dotnet build DrMoustache.slnx -c Release --no-restore

      # Template tests pack and install, so they must not use --no-build:
      # they exercise the packaged artifacts, not this build's output.
      # Do not size a timeout from a warm local run. The template tests restore
      # Microsoft.Data.Sqlite and the Microsoft.Extensions tree into scaffolded
      # projects; cold, that download dominates. The closest local measurement
      # was 15m37s and even that had partially-warm packages, so the true cold
      # cost is unmeasured. 45 minutes is deliberate headroom for a genuinely
      # cold runner, not an estimate.
      - name: Test
        timeout-minutes: 45
        run: dotnet test DrMoustache.slnx -c Release --no-build

      - name: Pack
        run: dotnet pack DrMoustache.slnx -c Release --no-build -o ./artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: ./artifacts/*.nupkg

  # The same build and tests on SDK 10. global.json pins SDK 11; this job repoints it, so the
  # projects build net10.0 alone (Directory.Build.props adds net11.0 only on SDK 11). It proves
  # those builds need nothing from SDK 11, and that a host still on SDK 10 can build.
  build-sdk10:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x

      - name: Select SDK 10
        run: |
          python3 - <<'PY'
          import json
          g = json.load(open("global.json"))
          g["sdk"] = {"version": "10.0.100", "rollForward": "latestFeature"}
          json.dump(g, open("global.json", "w"), indent=2)
          PY
          dotnet --version
          case "$(dotnet --version)" in 10.*) ;; *) echo "::error::expected SDK 10"; exit 1 ;; esac

      - name: Build
        run: |
          dotnet build DrMoustache.slnx -c Release

      - name: Test
        run: |
          dotnet test DrMoustache.slnx -c Release --no-build

